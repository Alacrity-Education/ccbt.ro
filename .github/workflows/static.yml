# Builds ccbt.ro: the same code as cms.ccbt.ro, exported as a static site
# (NEXT_PUBLIC_STATIC_EXPORT=true, output: 'export') and published to
# Cloudflare Pages. The export reads every piece of content from the CMS's REST
# API over HTTP, so this build needs no database, no tunnel and no Payload
# secret.
#
# Payload's admin UI and its route handlers cannot be prerendered, and Next has
# no config switch to exclude an app route, so those directories are deleted
# from the checkout before building (see "Strip server-only routes"). The
# sitemap and robots.txt are force-static app routes and stay: the export is
# expected to write them to out/.
#
# - Push to main: deploys production.
# - Pull request into main: the identical build, deployed as a preview under
#   the alias pr-<number>, with its link posted on the PR. Never over production.
# - workflow_call / workflow_dispatch: so a CMS "content published" webhook
#   relay can rebuild the site without a code change.
#
# Repository configuration:
#   secrets.CLOUDFLARE_API_TOKEN     - token with the "Cloudflare Pages: Edit"
#                                      permission
#   secrets.CLOUDFLARE_ACCOUNT_ID    - Cloudflare account id
#   vars.CLOUDFLARE_PAGES_PROJECT    - the Pages project name
#   vars.NEXT_PUBLIC_PAYLOAD_API_URL - the CMS REST API this build reads,
#                                      INCLUDING the /api suffix, e.g.
#                                      https://cms.ccbt.ro/api
#   vars.NEXT_PUBLIC_SERVER_URL      - public URL of the static site, no
#                                      trailing slash, e.g. https://ccbt.ro
#
# The Pages project must be a *direct upload* project (created by this
# workflow's first run, or with `wrangler pages project create`), and its
# production branch must be `main` — a deploy whose branch name does not match
# the project's production branch lands as a preview, so a mismatch here is a
# site that silently never updates.
#
# Neither of the NEXT_PUBLIC_* values is a secret: both are inlined into the
# exported HTML and JavaScript, so they are published the moment the site is.
# They are repository *variables* for that reason. Never add PAYLOAD_SECRET or
# DATABASE_URI here — this build has no use for them and the output is public.
name: Static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: main

concurrency:
  group: static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    # A pull request from a fork is given no secrets, so it cannot deploy a
    # preview; running it would only fail at the last step.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Set when another workflow calls this one; otherwise the commit that
          # triggered the run.
          ref: ${{ inputs.ref || github.sha }}
          # Strings on purpose: a bare 0 is falsy in a GitHub expression, so
          # `&& 0 || 1` would always evaluate to 1. A pull request needs the
          # history to diff against its base.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # A pull request that only touches docs, tests or CI skips the build and
      # the preview. Pushes to main, CMS publishes and manual runs always build.
      - name: Does this change affect the site?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            build=true
          else
            build=$(bash scripts/ci/needs-build.sh "$BASE_SHA" "$HEAD_SHA" \
              .github/workflows/static.yml scripts/ci/needs-build.sh scripts/ci/check-static-output.mjs)
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          [ "$build" = true ] || echo "Skipped: this pull request changes nothing the static site reads." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.build == 'true'
        with:
          # Matches the Dockerfile's node:22 base, so both builds run the same
          # runtime and a problem that appears in one appears in the other.
          node-version: 22
          cache: npm

      # npm ci, not npm install: the lockfile is the record of what the CMS
      # image was built from, and the two sites must ship the same dependencies.
      - name: Install dependencies
        if: steps.scope.outputs.build == 'true'
        run: npm ci

      # Next has no way to exclude app routes via config, so anything that
      # cannot be prerendered is deleted from the checkout before building:
      #   (payload)        - admin UI and the REST/GraphQL handlers
      #   (frontend)/next  - draft preview, exit-preview and seed handlers
      # The sitemap and robots routes are deliberately NOT removed; the export
      # is supposed to emit them, and "Check export" fails if it did not.
      - name: Strip server-only routes
        if: steps.scope.outputs.build == 'true'
        run: |
          rm -rf "src/app/(payload)"
          rm -rf "src/app/(frontend)/next"

      # npx next build rather than npm run build: package.json's build script is
      # followed by a postbuild hook that runs next-sitemap, which is configured
      # for the server build and would overwrite or fight with the exported
      # sitemap routes. Calling next directly skips the hook.
      - name: Build static export
        if: steps.scope.outputs.build == 'true'
        run: npx next build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_PAYLOAD_API_URL: ${{ vars.NEXT_PUBLIC_PAYLOAD_API_URL }}
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}

      # A build against an unreachable or empty API still exits 0: the pages
      # that take a route parameter simply prerender nothing. Without this
      # guard that publishes a near-empty site over a working one.
      - name: Verify export
        if: steps.scope.outputs.build == 'true'
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/404.html   || { echo "::error::out/404.html missing"; exit 1; }
          pages=$(find out -name '*.html' | wc -l)
          echo "exported $pages HTML pages"
          if [ "$pages" -lt 3 ]; then
            echo "::error::only $pages pages exported. The API is probably unreachable."
            exit 1
          fi

      # Page metadata, the footer, internal links, sitemap.xml, robots.txt and
      # every image the pages load from the CMS.
      - name: Check export
        if: steps.scope.outputs.build == 'true'
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
        run: node scripts/ci/check-static-output.mjs out

      # Kept alongside the deploy so a published build is always inspectable
      # offline, and so a failed upload still leaves something to publish.
      - name: Upload export as artifact
        if: steps.scope.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 7

      # A pull request deploys under the branch alias pr-<number>, which
      # Cloudflare serves at its own hostname and never promotes to production.
      - name: Deploy to Cloudflare Pages
        if: steps.scope.outputs.build == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}

      - name: Post the preview link on the PR
        if: steps.scope.outputs.build == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo '<!-- static-preview -->'
            echo '### Previzualizare ccbt.ro'
            echo
            echo "**${ALIAS_URL:-$DEPLOY_URL}**"
            echo
            echo "Construit din \`${SHA:0:7}\` cu conținutul live din CMS. Exact acest build: ${DEPLOY_URL:-n/a}"
          } > preview.md
          # One comment per PR, edited in place, rather than a new one per push.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- static-preview -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@preview.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file preview.md
          fi
          echo "Preview: ${ALIAS_URL:-$DEPLOY_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always() && steps.scope.outputs.build == 'true'
        run: |
          {
            echo "### Static export"
            echo
            echo "- Pages: $(find out -name '*.html' 2>/dev/null | wc -l)"
            echo "- CMS API: ${{ vars.NEXT_PUBLIC_PAYLOAD_API_URL || 'not configured' }}"
            echo "- Site URL: ${{ vars.NEXT_PUBLIC_SERVER_URL || 'not configured' }}"
            echo "- Deployed: ${{ steps.deploy.outputs.deployment-url || 'no' }}"
            echo "- Artifact: \`static-export\`"
          } >> "$GITHUB_STEP_SUMMARY"
