# Builds ccbt.ro: the same code as cms.ccbt.ro, exported as a static site
# (NEXT_PUBLIC_STATIC_EXPORT=true, output: 'export') and published as plain
# files. The export reads every piece of content from the CMS's REST API over
# HTTP, so this build needs no database, no tunnel and no Payload secret.
#
# Payload's admin UI and its route handlers cannot be prerendered, and Next has
# no config switch to exclude an app route, so those directories are deleted
# from the checkout before building (see "Strip server-only routes"). The
# sitemap and robots.txt are force-static app routes and stay: the export is
# expected to write them to out/.
#
# No static host has been chosen yet. Until one is, this workflow builds the
# export, verifies it and uploads out/ as the `static-export` artifact, and the
# publish step below skips with a notice — the same way docker.yml skips the
# Coolify call when COOLIFY_WEBHOOK is unset, so the useful work still happens
# while the hosting is being set up. Pointing it at a host means filling in one
# step; the alternatives are written out in the comments there.
#
# Repository configuration:
#   vars.NEXT_PUBLIC_PAYLOAD_API_URL - the CMS REST API this build reads,
#                                      INCLUDING the /api suffix, e.g.
#                                      https://cms.ccbt.ro/api
#   vars.NEXT_PUBLIC_SERVER_URL      - public URL of the static site, no
#                                      trailing slash, e.g. https://ccbt.ro
#   secrets.STATIC_DEPLOY_WEBHOOK    - optional; URL the publish step calls to
#                                      tell the host to pull the new build
#   secrets.STATIC_DEPLOY_TOKEN      - optional; bearer token for that webhook
#
# A host that uploads instead of pulling needs its own credentials in place of
# those two. For reference, Cloudflare Pages would need
# secrets.CLOUDFLARE_API_TOKEN (scope "Cloudflare Pages: Edit"),
# secrets.CLOUDFLARE_ACCOUNT_ID and vars.CLOUDFLARE_PAGES_PROJECT; GitHub Pages
# would need no secrets but `permissions: pages: write, id-token: write` and the
# actions/deploy-pages action; Netlify would need secrets.NETLIFY_AUTH_TOKEN and
# vars.NETLIFY_SITE_ID.
#
# Neither of the NEXT_PUBLIC_* values is a secret: both are inlined into the
# exported HTML and JavaScript, so they are published the moment the site is.
# They are repository *variables* for that reason. Never add PAYLOAD_SECRET or
# DATABASE_URI here — this build has no use for them and the output is public.
name: Static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # So a CMS "content published" webhook relay can rebuild the site without a
  # code change. Nothing calls this yet.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: main

concurrency:
  group: static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Set when another workflow calls this one; otherwise the commit that
          # triggered the run.
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:22 base, so both builds run the same
          # runtime and a problem that appears in one appears in the other.
          node-version: 22
          cache: npm

      # npm ci, not npm install: the lockfile is the record of what the CMS
      # image was built from, and the two sites must ship the same dependencies.
      - name: Install dependencies
        run: npm ci

      # Next has no way to exclude app routes via config, so anything that
      # cannot be prerendered is deleted from the checkout before building:
      #   (payload)        - admin UI and the REST/GraphQL handlers
      #   (frontend)/next  - draft preview, exit-preview and seed handlers
      # The sitemap and robots routes are deliberately NOT removed; the export
      # is supposed to emit them, and "Check export" fails if it did not.
      - name: Strip server-only routes
        run: |
          rm -rf "src/app/(payload)"
          rm -rf "src/app/(frontend)/next"

      # npx next build rather than npm run build: package.json's build script is
      # followed by a postbuild hook that runs next-sitemap, which is configured
      # for the server build and would overwrite or fight with the exported
      # sitemap routes. Calling next directly skips the hook.
      - name: Build static export
        run: npx next build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_PAYLOAD_API_URL: ${{ vars.NEXT_PUBLIC_PAYLOAD_API_URL }}
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}

      # A build against an unreachable or empty API still exits 0: the pages
      # that take a route parameter simply prerender nothing. Without this
      # guard that publishes a near-empty site over a working one.
      - name: Verify export
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/404.html   || { echo "::error::out/404.html missing"; exit 1; }
          pages=$(find out -name '*.html' | wc -l)
          echo "exported $pages HTML pages"
          if [ "$pages" -lt 3 ]; then
            echo "::error::only $pages pages exported. The API is probably unreachable."
            exit 1
          fi

      # Page metadata, the footer, internal links, sitemap.xml, robots.txt and
      # every image the pages load from the CMS.
      - name: Check export
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
        run: node scripts/ci/check-static-output.mjs out

      # Uploaded whether or not a host is configured, so the build is always
      # inspectable and a chosen host can be fed from here by hand in the
      # meantime.
      - name: Upload export as artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 7

      # ---------------------------------------------------------------------
      # PUBLISH — the one step to change once a static host is chosen.
      #
      # As written it suits a host that pulls: Coolify's static resource, or
      # anything else that exposes a deploy webhook. Point it at the host by
      # setting secrets.STATIC_DEPLOY_WEBHOOK (and STATIC_DEPLOY_TOKEN if the
      # webhook wants a bearer token). Skipped with a notice when unset, like
      # the Coolify call in docker.yml, so the build still reports green while
      # hosting is undecided. `secrets` cannot be read in an `if:`, hence the
      # guard inside the script.
      #
      # For a host that is pushed to, replace this whole step. Cloudflare Pages:
      #
      #   - name: Deploy to Cloudflare Pages
      #     uses: cloudflare/wrangler-action@v3
      #     with:
      #       apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #       accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #       command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      #
      # GitHub Pages: add `pages: write` and `id-token: write` to the job's
      # permissions, then actions/upload-pages-artifact followed by
      # actions/deploy-pages.
      #
      # Whichever is used, keep it off pull requests: a PR build must be
      # checked, never published over the live site.
      # ---------------------------------------------------------------------
      - name: Publish the export
        if: github.event_name != 'pull_request'
        env:
          STATIC_DEPLOY_WEBHOOK: ${{ secrets.STATIC_DEPLOY_WEBHOOK }}
          STATIC_DEPLOY_TOKEN: ${{ secrets.STATIC_DEPLOY_TOKEN }}
        run: |
          if [ -z "$STATIC_DEPLOY_WEBHOOK" ]; then
            echo "::notice::No static host configured (STATIC_DEPLOY_WEBHOOK is unset) — the export was built, checked and uploaded as the static-export artifact, but not published."
            exit 0
          fi
          # --fail so a rejected webhook fails the run rather than reporting a
          # deploy that never happened.
          curl --fail --silent --show-error --max-time 60 \
            --request POST "$STATIC_DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $STATIC_DEPLOY_TOKEN"
          echo
          echo "::notice::Static deploy requested"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Static export"
            echo
            echo "- Pages: $(find out -name '*.html' 2>/dev/null | wc -l)"
            echo "- CMS API: ${{ vars.NEXT_PUBLIC_PAYLOAD_API_URL || 'not configured' }}"
            echo "- Site URL: ${{ vars.NEXT_PUBLIC_SERVER_URL || 'not configured' }}"
            echo "- Artifact: \`static-export\`"
          } >> "$GITHUB_STEP_SUMMARY"
