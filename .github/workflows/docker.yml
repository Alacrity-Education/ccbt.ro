# Builds the full app (frontend + Payload admin/API) as a Docker image, pushes
# it to GHCR, and asks Coolify to redeploy.
#
# The build needs no database. `generateStaticParams` queries Payload, but with
# `output: 'standalone'` and no reachable DATABASE_URI it yields no params and
# the routes fall back to rendering on demand — so the workflow needs no tunnel
# and no database credentials. Migrations run at deploy time from the migrator
# image, gated before the app starts.
#
# Repository configuration:
#   vars.NEXT_PUBLIC_SERVER_URL               - public URL of this deployment
#   vars.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN      - optional; the map block
#   vars.NEXT_PUBLIC_MAPBOX_STYLE_DEFAULT     - optional; style URLs
#   vars.NEXT_PUBLIC_MAPBOX_STYLE_MONO        - optional
#   vars.NEXT_PUBLIC_MAPBOX_STYLE_MONO_BLACK  - optional
#   secrets.COOLIFY_WEBHOOK                   - optional; deploy webhook from
#                                               Configuration > Webhooks
#   secrets.COOLIFY_TOKEN                     - optional; API token with deploy
#                                               rights
#
# The NEXT_PUBLIC_* values are repository *variables*, not secrets: they are
# inlined into the client bundle and published in the image, so treating them as
# secret would be theatre. Never pass PAYLOAD_SECRET or a real DATABASE_URI as a
# build arg — the image is readable and so are its build args.
#
# Pushing uses the built-in GITHUB_TOKEN; no registry credentials needed.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${{ vars.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
            NEXT_PUBLIC_MAPBOX_STYLE_DEFAULT=${{ vars.NEXT_PUBLIC_MAPBOX_STYLE_DEFAULT }}
            NEXT_PUBLIC_MAPBOX_STYLE_MONO=${{ vars.NEXT_PUBLIC_MAPBOX_STYLE_MONO }}
            NEXT_PUBLIC_MAPBOX_STYLE_MONO_BLACK=${{ vars.NEXT_PUBLIC_MAPBOX_STYLE_MONO_BLACK }}

      # The standalone runtime image has no Payload CLI, so migrations ship as a
      # separate image built from the `migrator` stage. Run it as a one-shot
      # service before the app starts.
      - name: Derive migrator image tags
        id: meta-migrator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-migrator,onlatest=true
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skipped rather than failed when the webhook is not configured, so the
      # image still publishes while Coolify is being set up. `secrets` cannot be
      # read in an `if:`, hence the guard inside the script.
      - name: Trigger the Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::notice::COOLIFY_WEBHOOK is not set — image pushed, deploy not triggered"
            exit 0
          fi
          # --fail so a rejected webhook fails the run rather than reporting a
          # deploy that never happened.
          curl --fail --silent --show-error --max-time 60 \
            --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
          echo
          echo "::notice::Coolify deploy requested"

      - name: Summary
        run: |
          {
            echo "### Pushed images"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${{ steps.meta-migrator.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
